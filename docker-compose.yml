services:
  cache-us:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: cache-us
    domainname: cache-next.internal
    environment: &cache_env
      MIX_ENV: prod
      PHX_SERVER: "true"
      PORT: "4000"
      PHX_HOST: localhost
      CACHE_REGION: us-east
      TENANT_ID: demo-tenant
      CACHE_TMP_DIR: /tmp/cache-next
      RIAK_COOKIE: cache-next-riak
      RIAK_CLUSTER_NODES: riak@cache-us.cache-next.internal,riak@cache-eu.cache-next.internal,riak@cache-ap.cache-next.internal
      RIAK_HTTP_BIND: 0.0.0.0
      RIAK_HTTP_PORT: "8098"
      RIAK_PB_HOST: 127.0.0.1
      RIAK_PB_BIND: 0.0.0.0
      RIAK_PB_PORT: "8087"
      RIAK_PB_POOL_SIZE: "8"
      RIAK_NODENAME: riak@cache-us.cache-next.internal
      RIAK_SEED_NODE: riak@cache-us.cache-next.internal
      RIAK_HTTP_ENDPOINTS: http://127.0.0.1:8098
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http_protobuf
      OTEL_SERVICE_NAME: cache-next
      SECRET_KEY_BASE: 0GSIBal6lNQ0NJbJxL0xGELs7LeV2f3AsE7/ORrr0WpA3xHj1Mni6vKVR0xLjgMY
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=cache-next,service.instance.id=cache-us,cache.region=us-east,cache.tenant=demo-tenant
    depends_on:
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8098/ping >/dev/null && curl -fsS http://localhost:4000/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    labels:
      cache.region: us-east
      cache.tenant: demo-tenant
    ports:
      - "${CACHE_US_PORT:-4101}:4000"
      - "${RIAK_HTTP_PORT:-8098}:8098"
      - "${RIAK_PB_PORT:-8087}:8087"
    volumes:
      - riak-us-data:/opt/riak/data
    networks:
      default:
        aliases:
          - cache-us.cache-next.internal

  cache-eu:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: cache-eu
    domainname: cache-next.internal
    environment:
      <<: *cache_env
      CACHE_REGION: eu-west
      RIAK_NODENAME: riak@cache-eu.cache-next.internal
      RIAK_SEED_NODE: riak@cache-us.cache-next.internal
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=cache-next,service.instance.id=cache-eu,cache.region=eu-west,cache.tenant=demo-tenant
    depends_on:
      cache-us:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8098/ping >/dev/null && curl -fsS http://localhost:4000/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    labels:
      cache.region: eu-west
      cache.tenant: demo-tenant
    ports:
      - "${CACHE_EU_PORT:-4102}:4000"
    volumes:
      - riak-eu-data:/opt/riak/data
    networks:
      default:
        aliases:
          - cache-eu.cache-next.internal

  cache-ap:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: cache-ap
    domainname: cache-next.internal
    environment:
      <<: *cache_env
      CACHE_REGION: ap-south
      RIAK_NODENAME: riak@cache-ap.cache-next.internal
      RIAK_SEED_NODE: riak@cache-us.cache-next.internal
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=cache-next,service.instance.id=cache-ap,cache.region=ap-south,cache.tenant=demo-tenant
    depends_on:
      cache-eu:
        condition: service_healthy
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8098/ping >/dev/null && curl -fsS http://localhost:4000/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    labels:
      cache.region: ap-south
      cache.tenant: demo-tenant
    ports:
      - "${CACHE_AP_PORT:-4103}:4000"
    volumes:
      - riak-ap-data:/opt/riak/data
    networks:
      default:
        aliases:
          - cache-ap.cache-next.internal

  prometheus:
    image: prom/prometheus:v3.11.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./ops/loki/config.yml:/etc/loki/config.yml:ro

  promtail:
    image: grafana/promtail:3.5.0
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki
    volumes:
      - ./ops/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/config.yml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${OTLP_PORT:-4318}:4318"
    volumes:
      - ./ops/tempo/config.yml:/etc/tempo/config.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  riak-us-data:
  riak-eu-data:
  riak-ap-data:
