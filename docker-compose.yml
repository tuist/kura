services:
  cache-us:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: cache-us
    domainname: cache-next.internal
    environment: &cache_env
      PORT: "4000"
      TENANT_ID: demo-tenant
      CACHE_TMP_DIR: /tmp/cache-next
      CACHE_DATA_DIR: /var/cache/cache-next
      CACHE_REGION: us-east
      CACHE_NODE_URL: http://cache-us.cache-next.internal:4000
      CACHE_PEERS: http://cache-us.cache-next.internal:4000,http://cache-eu.cache-next.internal:4000,http://cache-ap.cache-next.internal:4000
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      OTEL_SERVICE_NAME: cache-us
      OTEL_DEPLOYMENT_ENVIRONMENT: local
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    labels:
      cache.region: us-east
      cache.tenant: demo-tenant
    ports:
      - "${CACHE_US_PORT:-4101}:4000"
    volumes:
      - cache-us-data:/var/cache/cache-next
    networks:
      default:
        aliases:
          - cache-us.cache-next.internal

  cache-eu:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: cache-eu
    domainname: cache-next.internal
    environment:
      <<: *cache_env
      CACHE_REGION: eu-west
      CACHE_NODE_URL: http://cache-eu.cache-next.internal:4000
      CACHE_PEERS: http://cache-us.cache-next.internal:4000,http://cache-eu.cache-next.internal:4000,http://cache-ap.cache-next.internal:4000
      OTEL_SERVICE_NAME: cache-eu
    depends_on:
      cache-us:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    labels:
      cache.region: eu-west
      cache.tenant: demo-tenant
    ports:
      - "${CACHE_EU_PORT:-4102}:4000"
    volumes:
      - cache-eu-data:/var/cache/cache-next
    networks:
      default:
        aliases:
          - cache-eu.cache-next.internal

  cache-ap:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: cache-ap
    domainname: cache-next.internal
    environment:
      <<: *cache_env
      CACHE_REGION: ap-south
      CACHE_NODE_URL: http://cache-ap.cache-next.internal:4000
      CACHE_PEERS: http://cache-us.cache-next.internal:4000,http://cache-eu.cache-next.internal:4000,http://cache-ap.cache-next.internal:4000
      OTEL_SERVICE_NAME: cache-ap
    depends_on:
      cache-eu:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
    labels:
      cache.region: ap-south
      cache.tenant: demo-tenant
    ports:
      - "${CACHE_AP_PORT:-4103}:4000"
    volumes:
      - cache-ap-data:/var/cache/cache-next
    networks:
      default:
        aliases:
          - cache-ap.cache-next.internal

  prometheus:
    image: prom/prometheus:v3.11.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/config.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./ops/loki/config.yml:/etc/loki/config.yml:ro

  promtail:
    image: grafana/promtail:3.5.0
    command: ["-config.file=/etc/promtail/config.yml"]
    depends_on:
      - loki
    volumes:
      - ./ops/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock

  tempo:
    image: grafana/tempo:2.8.1
    command: ["-config.file=/etc/tempo/config.yml"]
    ports:
      - "${TEMPO_PORT:-3200}:3200"
      - "${OTLP_PORT:-4318}:4318"
    volumes:
      - ./ops/tempo/config.yml:/etc/tempo/config.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    depends_on:
      - prometheus
      - loki
      - tempo
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro

volumes:
  cache-us-data:
  cache-eu-data:
  cache-ap-data:
