[package]
name = "cache-next"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
bytes = "1.11.0"
futures-util = "0.3.31"
hex = "0.4.3"
http-body-util = "0.1.3"
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
prometheus-client = "0.24.1"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "rustls-tls", "stream"] }
rocksdb = { version = "0.24.0", default-features = false, features = ["bindgen-runtime", "lz4"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["io"] }
tracing = "0.1.41"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3.23.0"
